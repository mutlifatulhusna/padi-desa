<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Lahan - Platform Padi Desa Cirebon Girang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        /* Shared Styles */
        .page-container { padding: 0; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        .search-box { display: flex; gap: 8px; flex: 1; max-width: 400px; }
        .search-box input { flex: 1; padding: 10px 16px; border: 2px solid #e8f0e6; border-radius: 10px; font-size: 14px; background: #f8fbf7; }
        .search-box input:focus { outline: none; border-color: #2d6a4f; }
        .search-box button { padding: 10px 20px; background: #2d6a4f; color: #fff; border: none; border-radius: 10px; cursor: pointer; }
        .btn-add { background: #2d6a4f; color: #fff; padding: 10px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .table-wrapper { overflow-x: auto; background: #fff; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e8f0e6; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        table thead { background: #f8fbf7; border-bottom: 2px solid #e8f0e6; }
        table th { padding: 14px 16px; text-align: left; font-weight: 600; color: #1e3a2f; white-space: nowrap; }
        table td { padding: 12px 16px; border-bottom: 1px solid #f0f5ee; vertical-align: middle; }
        .table-actions button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 4px; }
        .btn-edit { background: #fef3e8; color: #b45309; }
        .btn-delete { background: #fde8e8; color: #c0392b; }
        .empty-state { text-align: center; padding: 48px 20px; display: none; }
        .empty-state i { font-size: 48px; color: #8aaa9a; margin-bottom: 12px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .status-aktif { background: #e8f5e9; color: #2e7d32; }
        .status-istirahat { background: #fff3e0; color: #ef6c00; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 20px; max-width: 500px; width: 100%; padding: 32px; animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .close-modal { background: none; border: none; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 2px solid #e8f0e6; border-radius: 10px; font-size: 14px; }
        .form-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .form-actions button { padding: 10px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-save { background: #2d6a4f; color: #fff; }
        .btn-cancel { background: #e8f0e6; color: #1e3a2f; }
    </style>
</head>
<body>
    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Data Lahan</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="lahanForm">
                <input type="hidden" id="editId" />
                <div class="form-group">
                    <label>Pemilik (Petani) *</label>
                    <select id="petani_id" required>
                        <option value="">Pilih Petani</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Luas Lahan (hektar) *</label>
                    <input type="number" id="luas" step="0.1" required />
                </div>
                <div class="form-group">
                    <label>Lokasi *</label>
                    <input type="text" id="lokasi" required />
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Aktif">Aktif</option>
                        <option value="Masa Istirahat">Masa Istirahat</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-save">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="page-container">
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari lokasi lahan..." onkeyup="handleSearch(event)" />
                <button onclick="handleSearch()"><i class="fas fa-search"></i></button>
            </div>
            <button class="btn-add" id="btnAdd" onclick="showAddModal()"><i class="fas fa-plus"></i> Tambah Lahan</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Petani Pemilik</th>
                        <th>Luas (ha)</th>
                        <th>Lokasi</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-layer-group"></i>
            <h3>Belum Ada Data Lahan</h3>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/lahan.js"></script>
    <script src="../js/chatbot-widget.js?v=20261113_v25"></script>
    <script>
        const currentUser = auth.getCurrentUser();
        if (!currentUser) window.location.href = '../login.html';

        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const modalOverlay = document.getElementById('modalOverlay');
        const form = document.getElementById('lahanForm');
        const searchInput = document.getElementById('searchInput');
        const selectPetani = document.getElementById('petani_id');

        let accessibleLahan = [];
        
        // Hide add button for perangkat/kelompok. 
        // Petani can add if they exist in DB.
        if (currentUser.role === 'perangkat' || currentUser.role === 'kelompok') {
            document.getElementById('btnAdd').style.display = 'none';
        }

        // Init Petani Options
        function initPetaniSelect() {
            let pList = [];
            if (currentUser.role === 'admin') pList = DB.getAll(DB.keys.PETANI);
            else if (currentUser.role === 'petani') {
                const p = DB.getPetaniByUserId(currentUser.id);
                if (p) pList = [p];
                else document.getElementById('btnAdd').style.display = 'none';
            }
            selectPetani.innerHTML = '<option value="">Pilih Petani</option>';
            pList.forEach(p => {
                selectPetani.innerHTML += `<option value="${p.id}">${p.nama} (${p.nik})</option>`;
            });
        }

        async function loadData(keyword = '') {
            let data = [];
            const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
            if (isHttp) {
                try {
                    const url = currentUser.role === 'petani' ? `../api/lahan.php?user_id=${currentUser.id}` : '../api/lahan.php';
                    const res = await fetch(url);
                    if (res.ok) {
                        const resData = await res.json();
                        if (resData && resData.success && Array.isArray(resData.data)) {
                            data = resData.data;
                        }
                    }
                } catch (e) {
                    console.warn('API error, fallback to localStorage:', e);
                }
            }
            if (!data || data.length === 0) {
                if (currentUser.role === 'admin' || currentUser.role === 'perangkat') {
                    data = keyword ? LahanManager.search(keyword) : LahanManager.getAll();
                } else if (currentUser.role === 'petani') {
                    const userPetani = DB.getPetaniByUserId(currentUser.id);
                    if (userPetani) data = LahanManager.getByPetaniId(userPetani.id);
                } else if (currentUser.role === 'kelompok') {
                    const userPetani = DB.getPetaniByUserId(currentUser.id);
                    if (userPetani) {
                        const anggota = DB.getPetaniByKelompok(userPetani.kelompok_tani_id);
                        anggota.forEach(a => {
                            data.push(...LahanManager.getByPetaniId(a.id));
                        });
                    }
                }
            }
            if (keyword) {
                const term = keyword.toLowerCase();
                data = data.filter(l => (l.lokasi && l.lokasi.toLowerCase().includes(term)) || (l.petani_nama && l.petani_nama.toLowerCase().includes(term)));
            }
            renderTable(data);
        }

        function renderTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                emptyState.style.display = 'block';
                document.querySelector('.table-wrapper').style.display = 'none';
                return;
            }
            emptyState.style.display = 'none';
            document.querySelector('.table-wrapper').style.display = 'block';

            data.forEach((l, i) => {
                const petani = DB.getById(DB.keys.PETANI, l.petani_id);
                const pName = petani ? petani.nama : 'Unknown';
                
                let canEdit = currentUser.role === 'admin' || 
                             (currentUser.role === 'petani' && petani && String(petani.user_id) === String(currentUser.id));

                let actions = canEdit ? `
                    <button class="btn-edit" onclick="editData('${l.id}')"><i class="fas fa-edit"></i></button>
                    <button class="btn-delete" onclick="deleteData('${l.id}')"><i class="fas fa-trash"></i></button>
                ` : `<span style="font-size:12px;color:#8aaa9a;"><i class="fas fa-eye"></i> View</span>`;

                const statusClass = l.status === 'Aktif' ? 'status-aktif' : 'status-istirahat';

                tableBody.innerHTML += `
                    <tr>
                        <td>${i + 1}</td>
                        <td><strong>${pName}</strong></td>
                        <td>${l.luas} ha</td>
                        <td>${l.lokasi}</td>
                        <td><span class="status-badge ${statusClass}">${l.status}</span></td>
                        <td class="table-actions">${actions}</td>
                    </tr>
                `;
            });
        }

        window.handleSearch = e => {
            if (e && e.key !== 'Enter' && e.type !== 'click' && e.type !== 'keyup') return;
            loadData(searchInput.value.trim());
        };

        window.showAddModal = () => {
            form.reset();
            document.getElementById('editId').value = '';
            document.getElementById('modalTitle').textContent = 'Tambah Lahan';
            if(currentUser.role === 'petani'){
                const p = DB.getPetaniByUserId(currentUser.id);
                if(p) document.getElementById('petani_id').value = p.id;
            }
            modalOverlay.classList.add('active');
        };

        window.closeModal = () => modalOverlay.classList.remove('active');

        window.editData = id => {
            const l = LahanManager.getById(id);
            if (!l) return;
            document.getElementById('editId').value = l.id;
            document.getElementById('petani_id').value = l.petani_id;
            document.getElementById('luas').value = l.luas;
            document.getElementById('lokasi').value = l.lokasi;
            document.getElementById('status').value = l.status;
            document.getElementById('modalTitle').textContent = 'Edit Data Lahan';
            modalOverlay.classList.add('active');
        };

        window.deleteData = async id => {
            if (confirm('Yakin hapus lahan ini? Data akan dihapus dari database MySQL.')) {
                try {
                    await fetch(`../api/lahan.php?id=${id}`, { method: 'DELETE' });
                } catch (e) {
                    console.warn('API delete error:', e);
                }
                LahanManager.delete(id);
                loadData();
            }
        };

        form.addEventListener('submit', async e => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const petaniId = document.getElementById('petani_id').value;
            const luas = parseFloat(document.getElementById('luas').value) || 0;
            const lokasi = document.getElementById('lokasi').value.trim();
            const status = document.getElementById('status').value;

            // Simpan langsung ke database MySQL & kirim WhatsApp
            try {
                if (id) {
                    await fetch('../api/lahan.php', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: parseInt(id), luas, lokasi, status })
                    });
                } else {
                    await fetch('../api/lahan.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            petani_id: petaniId ? parseInt(petaniId) : null,
                            user_id: currentUser.id,
                            luas: luas,
                            lokasi: lokasi,
                            status: status
                        })
                    });
                }
            } catch (apiErr) {
                console.warn('Sync to MySQL API error:', apiErr);
            }

            const data = {
                petani_id: petaniId,
                luas: luas,
                lokasi: lokasi,
                status: status
            };
            id ? LahanManager.update(id, data) : LahanManager.create(data);
            closeModal();
            loadData();
        });

        initPetaniSelect();
        loadData();
    </script>
</body>
</html>
