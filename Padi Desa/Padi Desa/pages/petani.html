<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Petani - Platform Padi Desa Cirebon Girang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        /* ===== PETANI PAGE ===== */
        .petani-page {
            padding: 0;
        }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .toolbar .search-box {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
        }

        .toolbar .search-box input {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #e8f0e6;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fbf7;
            transition: 0.3s;
        }

        .toolbar .search-box input:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .toolbar .search-box button {
            padding: 10px 20px;
            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .toolbar .search-box button:hover {
            background: #1b4332;
        }

        .toolbar .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e8f0e6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead {
            background: #f8fbf7;
            border-bottom: 2px solid #e8f0e6;
        }

        table thead th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #1e3a2f;
            white-space: nowrap;
        }

        table tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f5ee;
            vertical-align: middle;
        }

        table tbody tr:hover {
            background: #f8fbf7;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .table-actions {
            display: flex;
            gap: 6px;
        }

        .table-actions button {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-view {
            background: #e8f0fe;
            color: #1a56db;
        }

        .btn-view:hover {
            background: #d0ddf5;
        }

        .btn-edit {
            background: #fef3e8;
            color: #b45309;
        }

        .btn-edit:hover {
            background: #fde8d0;
        }

        .btn-delete {
            background: #fde8e8;
            color: #c0392b;
        }

        .btn-delete:hover {
            background: #f5c6c6;
        }

        .btn-add {
            background: #2d6a4f;
            color: #fff;
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: #1b4332;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
        }

        .empty-state i {
            font-size: 48px;
            color: #8aaa9a;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            color: #1e3a2f;
            margin-bottom: 4px;
        }

        .empty-state p {
            color: #4a6b5a;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.95) translateY(-20px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-size: 22px;
            color: #1e3a2f;
        }

        .modal-header .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            color: #4a6b5a;
            cursor: pointer;
            transition: 0.3s;
            padding: 4px 8px;
        }

        .modal-header .close-modal:hover {
            color: #dc3545;
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1e3a2f;
            margin-bottom: 4px;
        }

        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8f0e6;
            border-radius: 10px;
            font-size: 14px;
            background: #f8fbf7;
            transition: 0.3s;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .modal .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .modal .form-actions button {
            padding: 10px 32px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal .form-actions .btn-save {
            background: #2d6a4f;
            color: #fff;
        }

        .modal .form-actions .btn-save:hover {
            background: #1b4332;
        }

        .modal .form-actions .btn-cancel {
            background: #e8f0e6;
            color: #1e3a2f;
        }

        .modal .form-actions .btn-cancel:hover {
            background: #d4e0d0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar .search-box {
                max-width: 100%;
            }

            .modal .form-row {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 20px;
                margin: 10px;
            }

            table {
                font-size: 13px;
            }

            table thead th,
            table tbody td {
                padding: 10px 12px;
            }
        }

        @media (max-width: 480px) {
            .table-actions {
                flex-direction: column;
                gap: 4px;
            }

            .table-actions button {
                padding: 4px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Data Petani</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="petaniForm">
                <input type="hidden" id="editId" />

                <div class="form-group">
                    <label for="nama">Nama Lengkap *</label>
                    <input type="text" id="nama" placeholder="Masukkan nama lengkap" required />
                </div>

                <div class="form-group">
                    <label for="email">Email / Gmail Akun</label>
                    <input type="email" id="email" placeholder="Contoh: petani@desa.id" />
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <textarea id="alamat" placeholder="Masukkan alamat lengkap"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="no_telepon">No. Telepon</label>
                        <input type="text" id="no_telepon" placeholder="08xxxxxxxxxx" />
                    </div>
                    <div class="form-group">
                        <label for="varietas_padi">Varietas Padi</label>
                        <select id="varietas_padi">
                            <option value="">Pilih Varietas</option>
                            <option value="Ciherang">Ciherang</option>
                            <option value="Mekongga">Mekongga</option>
                            <option value="Inpari">Inpari</option>
                            <option value="IR64">IR64</option>
                            <option value="Situ Bagendit">Situ Bagendit</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="kelompok_tani_id">Kelompok Tani</label>
                        <select id="kelompok_tani_id">
                            <option value="">Tidak Ada</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="luas_lahan">Luas Lahan (ha)</label>
                        <input type="number" id="luas_lahan" placeholder="Contoh: 2.5" step="0.1" min="0" />
                    </div>
                </div>

                <div class="form-group" id="lokasiLahanGroup">
                    <label for="lokasi_lahan">Lokasi Lahan</label>
                    <input type="text" id="lokasi_lahan" placeholder="Contoh: Blok A, Sawah Utara" />
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-save">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="petani-page">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari petani..." onkeyup="handleSearch(event)" />
                <button onclick="handleSearch()"><i class="fas fa-search"></i></button>
            </div>
            <div class="actions">
                <button class="btn-add" id="btnAddPetani" onclick="showAddModal()">
                    <i class="fas fa-plus"></i> Tambah Petani
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Email / Akun</th>
                        <th>Alamat</th>
                        <th>No. Telepon</th>
                        <th>Kelompok Tani</th>
                        <th>Luas Lahan</th>
                        <th>Varietas</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="petaniTableBody">
                    <!-- Di-generate oleh JS -->
                </tbody>
            </table>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display:none;">
            <i class="fas fa-users"></i>
            <h3>Belum Ada Data Petani</h3>
            <p>Klik tombol "Tambah Petani" untuk menambahkan data pertama.</p>
        </div>

        <!-- Stats -->
        <div style="margin-top: 24px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 14px; color: #4a6b5a;">
            <span><strong id="totalPetani">0</strong> Petani</span>
            <span>Total Luas: <strong id="totalLuas">0</strong> ha</span>
            <span>Rata-rata: <strong id="rataLuas">0</strong> ha</span>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/petani.js"></script>
    <script src="../js/chatbot-widget.js?v=20261113_v25"></script>
    <script>
        // ========================================
        // PETANI PAGE CONTROLLER
        // ========================================

        const currentUser = auth.getCurrentUser();

        // ===== CHECK ACCESS =====
        if (!currentUser) {
            window.location.href = '../login.html';
        }

        // Only admin, perangkat, and petani can access this page
        if (!['admin', 'perangkat', 'petani', 'kelompok'].includes(currentUser.role)) {
            window.location.href = '../dashboard.html';
        }

        // ===== DOM REFS =====
        const tableBody = document.getElementById('petaniTableBody');
        const emptyState = document.getElementById('emptyState');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const form = document.getElementById('petaniForm');
        const searchInput = document.getElementById('searchInput');
        
        // Buttons
        const btnAddPetani = document.getElementById('btnAddPetani');
        
        // Stats
        const statTotal = document.getElementById('totalPetani');
        const statLuas = document.getElementById('totalLuas');
        const statRata = document.getElementById('rataLuas');
        
        // Form Inputs
        const inputEditId = document.getElementById('editId');
        const inputNama = document.getElementById('nama');
        const inputEmail = document.getElementById('email');
        const inputAlamat = document.getElementById('alamat');
        const inputTelepon = document.getElementById('no_telepon');
        const inputVarietas = document.getElementById('varietas_padi');
        const inputKelompok = document.getElementById('kelompok_tani_id');
        const inputLuas = document.getElementById('luas_lahan');
        const inputLokasi = document.getElementById('lokasi_lahan');
        const groupLokasi = document.getElementById('lokasiLahanGroup');

        // State
        let allPetaniData = [];

        // ===== INIT =====
        function init() {
            // Apply role constraints for Add button
            if (currentUser.role === 'perangkat' || currentUser.role === 'kelompok' || currentUser.role === 'petani') {
                if (btnAddPetani) btnAddPetani.style.display = 'none';
            }

            // Populate Kelompok Tani dropdown
            const kelompokList = PetaniManager.getAllKelompok();
            kelompokList.forEach(k => {
                const option = document.createElement('option');
                option.value = k.id;
                option.textContent = k.nama;
                inputKelompok.appendChild(option);
            });

            loadData();
        }

        // ===== LOAD DATA =====
        function loadData(keyword = '') {
            let data = PetaniManager.getAccessiblePetani(currentUser);
            
            if (keyword) {
                const term = keyword.toLowerCase();
                data = data.filter(p => 
                    (p.nama && p.nama.toLowerCase().includes(term)) ||
                    (p.no_telepon && p.no_telepon.includes(term)) ||
                    (p.varietas_padi && p.varietas_padi.toLowerCase().includes(term)) ||
                    (p.alamat && p.alamat.toLowerCase().includes(term))
                );
            }

            allPetaniData = data;
            renderTable(data);
            updateStats();
        }

        // ===== RENDER TABLE =====
        function renderTable(data) {
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                emptyState.style.display = 'block';
                document.querySelector('.table-wrapper').style.display = 'none';
                return;
            }
            
            emptyState.style.display = 'none';
            document.querySelector('.table-wrapper').style.display = 'block';

            data.forEach((p, index) => {
                const kelompok = p.kelompok_tani_id ? DB.getKelompokById(p.kelompok_tani_id)?.nama || '-' : '-';
                
                // Action Buttons based on role
                let actions = '';
                
                if (currentUser.role === 'admin') {
                    actions = `
                        <button class="btn-edit" onclick="editPetani('${p.id}')" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="btn-delete" onclick="deletePetani('${p.id}')" title="Hapus"><i class="fas fa-trash"></i></button>
                    `;
                } else if (currentUser.role === 'petani') {
                    // Petani can only edit their own profile
                    const ownPetani = DB.getPetaniByUserId(currentUser.id);
                    if (ownPetani && ownPetani.id === p.id) {
                        actions = `
                            <button class="btn-edit" onclick="editPetani('${p.id}')" title="Edit"><i class="fas fa-edit"></i></button>
                        `;
                    }
                }
                
                // Perangkat and Kelompok can only view
                if (!actions) {
                    actions = `<span style="font-size: 12px; color: #8aaa9a;"><i class="fas fa-eye"></i> Hanya Lihat</span>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong>${p.nama}</strong></td>
                    <td>${p.username || p.email || (p.no_telepon ? p.no_telepon : '-')}</td>
                    <td>${p.alamat || '-'}</td>
                    <td>${p.no_telepon ? `<a href="https://wa.me/62${p.no_telepon.replace(/^0/, '')}?text=Halo%20Bapak/Ibu%20${encodeURIComponent(p.nama)},%20kami%20dari%20Perangkat%20Desa%20Cirebon%20Girang" target="_blank" style="color:#16a34a; font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:5px;"><i class="fab fa-whatsapp"></i> ${p.no_telepon}</a>` : '-'}</td>
                    <td>${kelompok}</td>
                    <td>${p.luas_lahan || 0} ha</td>
                    <td>${p.varietas_padi || '-'}</td>
                    <td>
                        <div class="table-actions">
                            ${actions}
                        </div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // ===== SEARCH =====
        window.handleSearch = function(e) {
            if (e && e.key !== 'Enter' && e.type !== 'click' && e.type !== 'keyup') return;
            loadData(searchInput.value.trim());
        }

        // ===== MODAL LOGIC =====
        window.showAddModal = function() {
            inputEditId.value = '';
            form.reset();
            modalTitle.textContent = 'Tambah Data Petani';
            groupLokasi.style.display = 'block'; // Show location input for new data
            
            modalOverlay.classList.add('active');
        }

        window.closeModal = function() {
            modalOverlay.classList.remove('active');
            form.reset();
        }

        // Edit
        window.editPetani = function(id) {
            const p = PetaniManager.getById(id);
            if (!p) return;

            inputEditId.value = p.id;
            inputNama.value = p.nama;
            if (inputEmail) inputEmail.value = p.username || p.email || '';
            inputAlamat.value = p.alamat || '';
            inputTelepon.value = p.no_telepon || '';
            inputVarietas.value = p.varietas_padi || '';
            inputKelompok.value = p.kelompok_tani_id || '';
            inputLuas.value = p.luas_lahan || '';
            
            // Hide location when editing since it's a separate entity (Lahan)
            groupLokasi.style.display = 'none';
            
            modalTitle.textContent = 'Edit Data Petani';
            modalOverlay.classList.add('active');
        };

        // Delete
        window.deletePetani = function(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data petani ini? Semua data lahan dan panen terkait juga akan terhapus.')) {
                PetaniManager.delete(id);
                loadData(searchInput.value.trim());
            }
        };

        // Form Submit
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = inputEditId.value;
            const data = {
                nama: inputNama.value,
                nik: '',
                alamat: inputAlamat.value,
                no_telepon: inputTelepon.value,
                varietas_padi: inputVarietas.value,
                kelompok_tani_id: inputKelompok.value || null,
                luas_lahan: parseFloat(inputLuas.value) || 0,
                lokasi: inputLokasi.value
            };

            if (id) {
                // Update
                PetaniManager.update(id, data);
            } else {
                // Create
                PetaniManager.create(data);
            }

            closeModal();
            loadData(searchInput.value.trim());
        });

        // Close modal when clicking outside
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });

        // ===== STATS =====
        function updateStats() {
            // Recompute stats based on accessible data
            const total = allPetaniData.length;
            const luas = allPetaniData.reduce((sum, p) => sum + (p.luas_lahan || 0), 0);
            const rata = total > 0 ? (luas / total).toFixed(2) : 0;

            statTotal.textContent = total;
            statLuas.textContent = luas.toFixed(2);
            statRata.textContent = rata;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
